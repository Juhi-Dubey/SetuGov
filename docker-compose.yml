services:
  # -------------------------------------------------------------
  # 1. PostgreSQL 17 Database
  # Note: pgvector native extension is deferred to future scope.
  # -------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: setugov_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-setugov_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-setugov_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Ollama Local LLM Runtime
  # Canonical Model: llama3.2:3b
  # Run with: docker compose --profile local-llm up
  # -------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.5.7
    container_name: setugov_ollama
    restart: unless-stopped
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 3. SetuGov Python AI Decision-Support Service (Brain 1-5)
  # Exposed on host port 8000 for direct dev access / curl testing.
  # -------------------------------------------------------------
  ai:
    build:
      context: ./AI
      dockerfile: Dockerfile
    container_name: setugov_ai
    restart: unless-stopped
    environment:
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 8000
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-120}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      EMBEDDING_REQUEST_DIMENSIONS: ${EMBEDDING_REQUEST_DIMENSIONS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------
  # 4. SetuGov Express.js REST API Backend
  # Hot-reloads on src changes via nodemon + bind-mount.
  # -------------------------------------------------------------
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: setugov_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-setugov_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-}
      BANK_ENCRYPTION_KEY: ${BANK_ENCRYPTION_KEY:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      AI_SERVICE_URL: http://ai:8000
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      AI_MOCK_MODE: ${AI_MOCK_MODE:-false}
      AI_EMBEDDING_DIMENSION: ${AI_EMBEDDING_DIMENSION:-768}
      NODE_ENV: ${NODE_ENV:-development}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_FROM: ${EMAIL_FROM:-SetuGov Platform <noreply@setugov.gov.in>}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "5000:5000"
    volumes:
      # Hot-reload: changes to src/ are reflected inside the container immediately.
      - ./Backend/src:/app/src
      # Persist uploaded files across container restarts.
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
    # prisma db push syncs the schema without requiring migration files —
    # fast and safe for local development iteration.
    command: >
      sh -c "npx prisma db push &&
             npm run dev"

volumes:
  pgdata:
    driver: local
  ollama_data:
    driver: local
  uploads_data:
    driver: local